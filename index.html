<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Scrapbook</title>
  <style>
    /* Transparent / Tinted Wine Red Background */
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: rgba(114, 47, 55, 0.15); /* 0.15 is the transparency level */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Scrapbook Page Container */
    .scrapbook-container {
      max-width: 800px;
      width: 100%;
      background: #fdfbf7; /* Off-white paper color */
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* Page Layout */
    .page {
      display: none; /* Hidden by default */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      justify-items: center;
      min-height: 300px;
    }

    /* Active Page */
    .page.active {
      display: grid;
    }

    /* Image Box Styling */
    .image-box {
      width: 100%;
      aspect-ratio: 1; /* Keeps them perfectly square */
      background-color: #eee;
      border: 8px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      overflow: hidden;
      transition: all 0.3s ease;
      /* Slight random tilts for a scrapbook feel */
      transform: rotate(-2deg); 
    }

    .image-box:nth-child(even) {
      transform: rotate(3deg);
    }

    /* Hover effect */
    .image-box:hover {
      transform: scale(1.05) rotate(0deg);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures the image fills the box without stretching */
    }

    /* Navigation Buttons */
    .pagination {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 12px 24px;
      background-color: #722f37; /* Solid Wine Red */
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #5a252b; /* Darker wine red on hover */
    }

    button:disabled {
      background-color: #d3b8bc; /* Faded wine red for disabled state */
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="scrapbook-container">
    
    <div class="page active" id="page-1">
      <div class="image-box">
        <img src="IMG_2847.JPG" alt="Scrapbook memory 1">
      </div>
      <div class="image-box">
        <img src="IMG_2857.JPG" alt="Scrapbook memory 2">
      </div>
      <div class="image-box">
        <img src="IMG_2901.JPG" alt="Scrapbook memory 3">
      </div>
    </div>

    <div class="page" id="page-2">
      <div class="image-box">
        <img src="IMG_2917.JPG" alt="Scrapbook memory 4">
      </div>
      <div class="image-box">
        <img src="IMG_2931.jpg" alt="Scrapbook memory 5">
      </div>
    </div>

    <div class="pagination">
      <button id="prev-btn" disabled>&#8592; Back</button>
      <button id="next-btn">Next Page &#8594;</button>
    </div>

  </div>

  <script>
    // Simple pagination logic
    let currentPage = 1;
    const totalPages = 2; // Update this if you add more pages later

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pages = document.querySelectorAll('.page');

    function updateScrapbook() {
      // Hide all pages
      pages.forEach(page => page.classList.remove('active'));
      
      // Show the current page
      document.getElementById(`page-${currentPage}`).classList.add('active');

      // Update button status
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        updateScrapbook();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        updateScrapbook();
      }
    });
  </script>

</body>
</html>
