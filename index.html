<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hand-Drawn Scrapbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Architects+Daughter&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Changed to transparent/tinted wine red */
            --bg-color: rgba(114, 47, 55, 0.15); 
            --ink-color: #1a1a1a;
            --hand-font: 'Architects Daughter', cursive;
            --title-font: 'Caveat', cursive;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: var(--hand-font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Main Container - Upgraded for a Bigger, Wider Layout */
        .sketch-container {
            border: 6px solid var(--ink-color);
            border-radius: 20px 15px 30px 15px/15px 30px 15px 20px;
            padding: 40px;
            max-width: 1400px;
            width: 92%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2.5fr 1fr 1fr; 
            gap: 30px;
            background: #fff;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
            position: relative;
            box-sizing: border-box;
            align-items: center; 
        }

        .book-trigger-drawn img {
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .book-trigger-drawn img:hover {
            transform: scale(1.02) rotate(-1deg);
        }

        /* Playlist Columns */
        .playlist-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            min-width: 180px;
            box-sizing: border-box;
        }

        .playlist-title {
            text-align: center;
            font-size: 1.4rem;
            margin: 0;
            font-family: var(--hand-font);
        }

        .spotify-wrapper {
            border: 4px solid var(--ink-color);
            border-radius: 255px 20px 225px 20px/20px 225px 20px 255px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 450px; 
            background: transparent; 
        }

        .spotify-wrapper iframe {
            border: none;
            width: 100%;
            flex: 1;
            min-height: 450px; 
        }

        /* Background Music Controls */
        .audio-player {
            position: absolute;
            bottom: 10px;
            left: 40px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-player button {
            background: none;
            border: 2px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px/5px 20px 5px 20px;
            font-family: var(--hand-font);
            cursor: pointer;
            padding: 2px 10px;
        }
        
        .audio-player button:hover {
            background: #eee;
        }

        /* Fullscreen Scrapbook Overlay */
        .scrapbook-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(252, 250, 242, 0.98);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .scrapbook-overlay.active {
            display: flex;
            opacity: 1;
        }

        /* The Interactive Book UI */
        .open-book {
            width: 85%;
            height: 80%;
            background: #fff;
            border: 5px solid var(--ink-color);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            position: relative;
            transform: scale(0.8) rotateX(20deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .scrapbook-overlay.active .open-book {
            transform: scale(1) rotateX(0deg);
        }

        /* Book Spine/Center Crease */
        .open-book::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background: rgba(0,0,0,0.2);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* Book Pages */
        .book-page {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            box-sizing: border-box;
            position: relative;
        }

        .left-page {
            border-right: 2px dashed rgba(0,0,0,0.1);
        }

        .right-page {
            border-left: 2px dashed rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* Hand-Drawn Close Button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            z-index: 20;
            font-family: var(--title-font);
        }
        .close-btn:hover {
            color: red;
            transform: scale(1.1);
        }

        /* Pagination Grid Logic */
        .gallery-page {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-page.active {
            display: grid;
        }

        /* Pagination Controls */
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            margin-top: auto; /* Pushes buttons to the bottom of the page */
            padding-top: 20px;
        }

        .pagination-controls button {
            background: none;
            border: 3px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px/5px 20px 5px 20px;
            font-family: var(--title-font);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 20px;
            transition: all 0.2s;
        }

        .pagination-controls button:hover:not(:disabled) {
            background: #eee;
            transform: scale(1.05);
        }

        .pagination-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #999;
        }

        /* Polaroid/Hand-drawn Photo Frames */
        .photo-frame {
            background: #fff;
            padding: 10px 10px 30px 10px;
            border: 3px solid var(--ink-color);
            border-radius: 5px 15px 5px 10px/10px 5px 15px 5px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            transform: rotate(var(--r));
            transition: transform 0.2s ease;
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 5;
        }

        .photo-frame img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 2px solid var(--ink-color);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sketch-container {
                grid-template-columns: 1fr;
            }
            .open-book {
                flex-direction: column;
                width: 95%;
                height: 90%;
            }
            .open-book::before {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="sketch-container"> 
        
        <div class="book-trigger-drawn" onclick="openScrapbook()">
            <img src="THEBOOKCOVER1.png" alt="Open Scrapbook">
        </div>

        <div class="playlist-column">
            <h2 class="playlist-title">Lauren :) </h2>
            <div class="spotify-wrapper">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/4JTOCOZZg3Krq7ffixSgPV?utm_source=generator" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>            </div>
        </div>

        <div class="playlist-column">
            <h2 class="playlist-title">Darien :)</h2>
            <div class="spotify-wrapper">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1dpBbCBBYVQFlEXKfhl4MM?utm_source=generator" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>            </div>
        </div>

        <div class="audio-player">
            <span>🎵 Background Loop:</span>
            <button id="audioToggle" onclick="toggleBackgroundMusic()">Play</button>
            <audio id="bgMusic" src="" loop></audio>
        </div>

    </div>

    <div class="scrapbook-overlay" id="scrapbookOverlay">
        <span class="close-btn" onclick="closeScrapbook()">[ Close X ]</span>
        
        <div class="open-book">
            <div class="book-page left-page">
                <h2 style="font-family: var(--title-font); font-size: 3rem; margin-top: 0;">Memories</h2>
                <p> Tap anywhere outside or use the top right corner to close it up.</p>
                <hr style="border: none; border-top: 2px dashed var(--ink-color);">
                
                <p style="font-size: 0.9rem; color: #666;">upload a picture to have it here (temp):</p>
                <input type="file" id="imageLoader" accept="image/*" onchange="handleImageUpload(event)" style="font-family: var(--hand-font);">
            </div>

            <div class="book-page right-page">
                <h3 style="font-family: var(--title-font); font-size: 2.5rem; margin-top: 0;">The Gallery</h3>
                
                <div class="gallery-page active" id="gallery-page-1">
                    <div class="photo-frame" style="--r: -3deg;">
                        <img src="IMG_2847.JPG" alt="Scrapbook Memory 1">
                    </div>
                    <div class="photo-frame" style="--r: 4deg;">
                        <img src="IMG_2857.JPG" alt="Scrapbook Memory 2">
                    </div>
                    <div class="photo-frame" style="--r: -2deg;">
                        <img src="IMG_2901.JPG" alt="Scrapbook Memory 3">
                    </div>
                </div>

                <div class="gallery-page" id="gallery-page-2">
                    <div class="photo-frame" style="--r: 2deg;">
                        <img src="IMG_2917.JPG" alt="Scrapbook Memory 4">
                    </div>
                    <div class="photo-frame" style="--r: -4deg;">
                        <img src="IMG_2931.jpg" alt="Scrapbook Memory 5">
                    </div>
                </div>

                <div class="pagination-controls">
                    <button id="prevBtn" onclick="changePage(-1)" disabled>← Back</button>
                    <button id="nextBtn" onclick="changePage(1)">Next →</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Opening / Closing Scrapbook Overlays
        function openScrapbook() {
            const overlay = document.getElementById('scrapbookOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.classList.add('active');
            }, 10);
        }

        function closeScrapbook() {
            const overlay = document.getElementById('scrapbookOverlay');
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 400); 
        }

        // Pagination Logic
        let currentPage = 1;
        const totalPages = 2; // Change this number if you add a 3rd page later!

        function changePage(direction) {
            // Hide current page
            document.getElementById(`gallery-page-${currentPage}`).classList.remove('active');
            
            // Update page number
            currentPage += direction;
            
            // Show new page
            document.getElementById(`gallery-page-${currentPage}`).classList.add('active');
            
            // Update buttons
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        // Handles local image inserts dynamically (Now targets the ACTIVE page)
        function handleImageUpload(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Find whichever page the user is currently looking at
                const activePage = document.querySelector('.gallery-page.active');
                
                const frame = document.createElement('div');
                frame.className = 'photo-frame';
                const randomRotation = (Math.random() * 8 - 4).toFixed(1) + 'deg';
                frame.style.setProperty('--r', randomRotation);

                const img = document.createElement('img');
                img.src = e.target.result;

                frame.appendChild(img);
                activePage.insertBefore(frame, activePage.firstChild);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // Separate Background Audio Logic Control Toggle
        function toggleBackgroundMusic() {
            const audio = document.getElementById('bgMusic');
            const btn = document.getElementById('audioToggle');
            
            if(!audio.src || audio.src === window.location.href) {
                alert("To activate independent background tracking without clicking standard Spotify overlays, append a direct raw MP3 music streaming asset file target onto line 125's audio src attribute!");
                return;
            }

            if (audio.paused) {
                audio.play();
                btn.innerText = "Pause";
            } else {
                audio.pause();
                btn.innerText = "Play";
            }
        }
    </script>
</body>
</html>
