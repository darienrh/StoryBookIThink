<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hand-Drawn Scrapbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Architects+Daughter&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Changing base background to tinted wine red */
            --bg-color: rgba(114, 47, 55, 0.1); 
            --ink-color: #1a1a1a;
            --hand-font: 'Architects Daughter', cursive;
            --title-font: 'Caveat', cursive;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color); /* Tinted Wine Red everywhere NOT WORKING*/
            color: var(--ink-color);
            font-family: var(--hand-font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Main Container - Preservation */
        .sketch-container {
            border: 6px solid var(--ink-color);
            border-radius: 20px 15px 30px 15px/15px 30px 15px 20px;
            padding: 40px;
            max-width: 1400px;
            width: 92%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2.5fr 1fr 1fr; 
            gap: 30px;
            background: #fff;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
            position: relative;
            box-sizing: border-box;
            align-items: center;
        }

        .book-trigger-drawn img {
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            cursor: pointer; /* Ensure cover is clickable */
        }
        
        .book-trigger-drawn img:hover {
            transform: scale(1.02) rotate(-1deg);
        }

        /* Playlist Columns - Preservation */
        .playlist-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            min-width: 180px;
            box-sizing: border-box;
        }

        .playlist-title {
            text-align: center;
            font-size: 1.4rem;
            margin: 0;
            font-family: var(--hand-font);
        }

        .spotify-wrapper {
            border: 4px solid var(--ink-color);
            border-radius: 255px 20px 225px 20px/20px 225px 20px 255px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 450px; 
            background: transparent;
        }

        .spotify-wrapper iframe {
            border: none;
            width: 100%;
            flex: 1;
            min-height: 450px;
        }

        /* Background Music Controls - Preservation */
        .audio-player {
            position: absolute;
            bottom: 10px;
            left: 40px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-player button {
            background: none;
            border: 2px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px/5px 20px 5px 20px;
            font-family: var(--hand-font);
            cursor: pointer;
            padding: 2px 10px;
        }
        
        .audio-player button:hover {
            background: #eee;
        }

        /* Fullscreen Scrapbook Overlay - Revamped for Tinted Wine Red */
        .scrapbook-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Light tinted paper-like background *behind* the wine red outside tint? 
               User asked for wine red outside. I will make the overlay tint wine red too, 
               consistent with the body. The *book* pages themselves are white. */
            background: var(--bg-color); /* Matches the body tint for consistency outside the book */
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .scrapbook-overlay.active {
            display: flex;
            opacity: 1;
        }

        /* The Interactive Book UI - White book pages preserve book feel */
        .open-book {
            width: 85%;
            height: 80%;
            background: #fff; /* Paper-like white *within* the book */
            border: 5px solid var(--ink-color);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            position: relative;
            transform: scale(0.8) rotateX(20deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .scrapbook-overlay.active .open-book {
            transform: scale(1) rotateX(0deg);
        }

        /* Book Spine/Center Crease - Preservation */
        .open-book::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background: rgba(0,0,0,0.2);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* Book Pages */
        .book-page {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            box-sizing: border-box;
            position: relative;
        }

        .left-page {
            border-right: 2px dashed rgba(0,0,0,0.1);
        }

        /* Right Page - Flexible container for stacked pages and navigation */
        .right-page {
            border-left: 2px dashed rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column; /* Stack gallery pages container and pagination below */
        }

        /* Hand-Drawn Close Button - Preservation */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            z-index: 20;
            font-family: var(--title-font);
        }
        .close-btn:hover {
            color: red;
            transform: scale(1.1);
        }

        /* Container for stacked gallery pages */
        .gallery-page-container {
            position: relative;
            flex: 1; /* Occupy remaining vertical space */
        }

        /* Individual Gallery Pages - Hidden and Transparent by Default */
        .gallery-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
            opacity: 0;
            z-index: 1; /* Stacked below active page */
            transition: opacity 0.5s ease; /* Smooth transition */
            pointer-events: none; /* Prevent interaction when hidden */
        }

        /* Active Page is Visible and Interactive */
        .gallery-page.active {
            opacity: 1;
            z-index: 10; /* Stacked above hidden pages */
            pointer-events: auto; /* Re-enable interaction */
        }

        /* Polaroid/Hand-drawn Photo Frames - Preservation */
        .photo-frame {
            background: #fff;
            padding: 10px 10px 30px 10px;
            border: 3px solid var(--ink-color);
            border-radius: 5px 15px 5px 10px/10px 5px 15px 5px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            transform: rotate(var(--r));
            transition: transform 0.2s ease;
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 5;
        }

        .photo-frame img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 2px solid var(--ink-color);
        }

        /* Pagination Arrows - Stylable characters */
        .pagination-controls {
            display: flex;
            justify-content: center; /* Center the arrows horizontally */
            margin-top: auto; /* Push to the bottom of the right page */
            padding-top: 10px;
            font-family: var(--hand-font);
            font-size: 1.2rem;
            gap: 10px;
        }

        .pagination-controls button {
            background: none;
            border: none;
            color: var(--ink-color);
            font-family: inherit;
            font-size: 1.5rem; /* Larger arrows */
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s;
        }
        
        .pagination-controls button:hover:not([disabled]) {
            color: maroon; /* Hint of wine red on hover for arrows too */
        }
        
        .pagination-controls button[disabled] {
            opacity: 0.3; /* Style for disabled arrows */
            cursor: not-allowed;
        }

        /* Responsive adjustments - Preservation */
        @media (max-width: 768px) {
            .sketch-container {
                grid-template-columns: 1fr;
            }
            .open-book {
                flex-direction: column;
                width: 95%;
                height: 90%;
            }
            .open-book::before {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="sketch-container"> 
        
        <div class="book-trigger-drawn" onclick="openScrapbook()">
            <img src="THEBOOKCOVER1.png" alt="Open Scrapbook">
        </div>

        <div class="playlist-column">
            <h2 class="playlist-title">Lauren :) </h2>
            <div class="spotify-wrapper">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/4JTOCOZZg3Krq7ffixSgPV?utm_source=generator" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>            </div>
        </div>

        <div class="playlist-column">
            <h2 class="playlist-title">Darien :)</h2>
            <div class="spotify-wrapper">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1dpBbCBBYVQFlEXKfhl4MM?utm_source=generator" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>            </div>
        </div>

        <div class="audio-player">
            <span>🎵 Background Loop:</span>
            <button id="audioToggle" onclick="toggleBackgroundMusic()">Play</button>
            <audio id="bgMusic" src="Daniel Caesar - Get You ft. Kali Uchis - Rahim Williams (128k).mp3" loop></audio>
        </div>

    </div>

    <div class="scrapbook-overlay" id="scrapbookOverlay">
        <span class="close-btn" onclick="closeScrapbook()">[ Close X ]</span>
        
        <div class="open-book">
            <div class="book-page left-page">
                <h2 style="font-family: var(--title-font); font-size: 3rem; margin-top: 0;">Memories</h2>
                <p> Tap anywhere outside or use the top right corner to close it up.</p>
                <hr style="border: none; border-top: 2px dashed var(--ink-color);">
                
                <p style="font-size: 0.9rem; color: #666;">upload a picture to have it here (temp):</p>
                <input type="file" id="imageLoader" accept="image/*" onchange="handleImageUpload(event)" style="font-family: var(--hand-font);">
            </div>

            <div class="book-page right-page">
                <h3 style="font-family: var(--title-font); font-size: 2.5rem; margin-top: 0;">The Gallery</h3>
                
                <div class="gallery-page-container">
                    <div class="gallery-page active" id="gallery-grid-1">
                        <div class="photo-frame" style="--r: -3deg;">
                            <img src="IMG_2847.JPG" alt="Scrapbook Memory 1">
                        </div>
                        <div class="photo-frame" style="--r: 4deg;">
                            <img src="IMG_2857.JPG" alt="Scrapbook Memory 2">
                        </div>
                        <div class="photo-frame" style="--r: -2deg;">
                            <img src="IMG_2901.JPG" alt="Scrapbook Memory 3">
                        </div>
                    </div>

                    <div class="gallery-page" id="gallery-grid-2">
                        <div class="photo-frame" style="--r: 2deg;">
                            <img src="IMG_2917.JPG" alt="Scrapbook Memory 4">
                        </div>
                        <div class="photo-frame" style="--r: -4deg;">
                            <img src="IMG_2931.jpg" alt="Scrapbook Memory 5">
                        </div>
                    </div>
                </div>

                <div class="pagination-controls">
                    <button id="prevBtn" onclick="changePage(-1)" disabled>← Back</button>
                    <span>|</span>
                    <button id="nextBtn" onclick="changePage(1)">Next →</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Opening / Closing Scrapbook Overlays with Clean Transform Modifiers - Preservation
        function openScrapbook() {
            const overlay = document.getElementById('scrapbookOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.classList.add('active');
            }, 10);
        }

        function closeScrapbook() {
            const overlay = document.getElementById('scrapbookOverlay');
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 400); // Matches smooth cubic-bezier transitions
        }

        // Pagination Logic
        let currentPage = 1;
        const totalPages = 2; // Total number of gallery pages

        function changePage(direction) {
            // Calculate new page number
            let newPage = currentPage + direction;
            
            // Ensure page is within bounds
            if (newPage < 1) newPage = 1;
            if (newPage > totalPages) newPage = totalPages;

            // Update current page number variable
            currentPage = newPage;
            
            // Update page visibility with smooth transition
            updatePageVisibility();
            
            // Handle arrow enabling/disabling
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);
        }

        function updatePageVisibility() {
            // Hide all pages
            document.querySelectorAll('.gallery-page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Show the current page
            document.getElementById('gallery-grid-' + currentPage).classList.add('active');
        }

        // Handles local image inserts dynamically (Adjusted for pagination)
        function handleImageUpload(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Determine which page to insert into - let's stick to inserting into the active grid page
                const activeGrid = document.getElementById('gallery-grid-' + currentPage);
                
                // Create custom picture polaroid frame element wrapper
                const frame = document.createElement('div');
                frame.className = 'photo-frame';
                // Assign a randomized hand drawn tilt offset
                const randomRotation = (Math.random() * 8 - 4).toFixed(1) + 'deg';
                frame.style.setProperty('--r', randomRotation);

                const img = document.createElement('img');
                img.src = e.target.result;

                frame.appendChild(img);
                // Dynamic insertion into currently active grid page at beginning
                activeGrid.insertBefore(frame, activeGrid.firstChild);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // Separate Background Audio Logic Control Toggle - Preservation
        function toggleBackgroundMusic() {
            const audio = document.getElementById('bgMusic');
            const btn = document.getElementById('audioToggle');
            
            if(!audio.src || audio.src === window.location.href) {
                alert("To activate independent background tracking without clicking standard Spotify overlays, append a direct raw MP3 music streaming asset file target onto line 125's audio src attribute!");
                return;
            }

            if (audio.paused) {
                audio.play();
                btn.innerText = "Pause";
            } else {
                audio.pause();
                btn.innerText = "Play";
            }
        }
    </script>
</body>
</html>
